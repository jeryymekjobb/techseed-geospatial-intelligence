# Local services for the fire map. Both listen on 127.0.0.1 only.
#
#   docker compose up -d postgis tiles
#
# - postgis: spatial database for targets, terrain, detections and forecasts
#   (loaded with `python3 -m tools.load_postgis`). The password is for this local
#   database only; override it with FIREMAP_DB_PASSWORD.
# - tiles: offline map tiles for the map area, served from data/tiles/ (built with
#   `python3 -m tools.build_offline_tiles`).
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: firemap
      POSTGRES_USER: firemap
      POSTGRES_PASSWORD: ${FIREMAP_DB_PASSWORD:-firemap-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firemap -d firemap"]
      interval: 5s
      retries: 20

  tiles:
    image: maptiler/tileserver-gl:latest
    # The preview style renders without text here; the GUI draws place and lake names itself.
    command: ["--file", "/data/vastmanland.mbtiles", "--port", "8080"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data/tiles:/data:ro

volumes:
  postgis-data:
