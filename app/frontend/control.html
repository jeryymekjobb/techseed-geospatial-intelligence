<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechSeed Mission Control</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:,">
</head>
<body class="control">
  <header class="topbar">
    <h1>TECHSEED MISSION CONTROL</h1>
    <span id="control-label" class="data-label">Scenario</span>
    <button id="switch-demo" type="button" class="switch-demo">BYT DEMO</button>
  </header>
  <main class="control-layout">
    <section class="control-clock">
      <div id="sim-time" class="sim-time">–</div>
      <div id="playback" class="status">Ansluter …</div>
      <div class="control-row">
        <button id="play" type="button" data-command="play">PLAY</button>
        <button type="button" data-command="pause">PAUSE</button>
        <button type="button" data-command="reset" class="danger">RESET</button>
      </div>
      <div class="control-row speed-row">
        <button type="button" data-command="speed" data-speed="60">1 MIN/S</button>
        <button type="button" data-command="speed" data-speed="600">10 MIN/S</button>
        <button type="button" data-command="speed" data-speed="3600">1 TIMME/S</button>
      </div>
      <div class="control-row speed-row">
        <button id="show-all" type="button" data-command="seek">VISA ALLA</button>
        <button id="fly-incident" type="button" data-command="camera" data-target="incident">FLYG TILL</button>
        <button type="button" data-command="camera" data-target="home">ÖVERSIKT</button>
      </div>
    </section>
    <section>
      <h2>Satellitbilder</h2>
      <div class="control-row detection-row">
        <button type="button" data-command="satellite_detection" data-status="detection">SATELLITE DETECTION</button>
        <button id="next" type="button" data-command="next" disabled>NÄSTA ▸</button>
      </div>
      <div id="detection-step" class="status" aria-live="polite"></div>
      <h3>Kartan visar</h3>
      <div class="control-row image-row">
        <button type="button" data-image="off">KARTA</button>
        <button type="button" data-image="auto">SENASTE SATELLITBILD</button>
      </div>
      <fieldset id="image-types" class="image-types">
        <legend>Bildtyper som SENASTE SATELLITBILD följer</legend>
      </fieldset>
      <fieldset id="base-maps" class="image-types">
        <legend>Baskartor</legend>
      </fieldset>
      <div class="control-row pick-row">
        <button id="save-profile" type="button">SPARA PROFIL</button>
      </div>
      <div id="profile-note" class="status" aria-live="polite"></div>
      <label class="image-pick">Bild <select id="image-pick"></select></label>
      <div class="control-row pick-row">
        <button id="show-pick" type="button" disabled>VISA VALD BILD</button>
      </div>
      <div id="image-shown" class="status" aria-live="polite"></div>
      <div id="panel-choices" class="panel-choices"></div>
      <fieldset id="map-layers" class="image-types">
        <legend>Kartans lager</legend>
      </fieldset>
    </section>
    <section>
      <h2>Frågor</h2>
      <div id="control-questions" class="control-questions"></div>
      <div class="control-row pick-row">
        <button type="button" data-command="clear_answer">RENSA SVARET</button>
      </div>
      <div id="control-answer" class="status" aria-live="polite"></div>
    </section>
    <section>
      <h2>Events</h2>
      <div class="control-grid">
        <button type="button" data-command="sensor_failure" data-target="sensor-17" data-incident="wildfire">SENSOR FAILURE</button>
        <button type="button" data-command="sensor_failure" data-target="dv-01" data-incident="flood">SENSOR FAILURE</button>
        <button type="button" data-command="satcom_failure" data-toggle-off="satcom_restore" data-status="satcom_down">SATCOM FAILURE</button>
        <button type="button" data-command="road_closed">ROAD CLOSED</button>
        <button type="button" data-command="power_failure">POWER FAILURE</button>
        <button type="button" data-command="plus60" data-status="plus60" data-incident="wildfire">+60 MIN</button>
        <button type="button" data-command="god_view" data-status="god_view">GOD VIEW</button>
        <button type="button" data-command="space_view" data-status="space_view">SPACE VIEW</button>
        <button type="button" data-command="iot" data-status="iot">IOT PÅ/AV</button>
      </div>
      <h3>Filter</h3>
      <div class="control-grid filter-grid">
        <button type="button" data-command="filter" data-target="space" data-filter="space">SPACE</button>
        <button type="button" data-command="filter" data-target="iot" data-filter="iot">IOT</button>
        <button type="button" data-command="filter" data-target="infrastructure" data-filter="infrastructure">INFRASTRUCTURE</button>
        <button type="button" data-command="filter" data-target="weather" data-filter="weather">WEATHER</button>
        <button type="button" disabled>MARITIME – ingår inte i demon</button>
        <button type="button" disabled>AVIATION – ingår inte i demon</button>
        <button type="button" disabled>EMERGENCY – ingår inte i demon</button>
      </div>
      <p class="status">Alla händelser är syntetiska och märks så på huvudskärmen.</p>
    </section>
    <section>
      <h2>Läge</h2>
      <ul id="scenario-status" class="scenario-status"></ul>
      <div id="satcom-queue" class="satcom-queue"></div>
      <h2>IoT</h2>
      <div id="iot-confirms" class="iot-confirms"></div>
      <h3>Noder i montern</h3>
      <ul id="real-sensors" class="scenario-status"></ul>
      <div id="iot-connection" class="status"></div>
      <h2>Logg</h2>
      <ol id="event-log" class="event-log" reversed></ol>
      <div id="command-status" class="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="/scenario_events.js"></script>
  <script src="/sensors.js"></script>
  <script src="/landsat.js"></script>
  <script src="/basemaps.js"></script>
  <script src="/control.js"></script>
</body>
</html>
