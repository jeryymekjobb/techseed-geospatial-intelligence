<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Techseed Geospatial Intelligence</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:,">
</head>
<body class="menu-page">
  <!-- tools/start_demo.py's start page, in mission control's window until a demo or an area is chosen:
       first Övervakning or Scenarier, then the areas or the demos. -->
  <main class="demo-menu">
    <h1 id="menu-title">Techseed Geospatial Intelligence</h1>
    <section id="start-view" class="demo-list">
      <button id="choose-monitoring" type="button" class="demo-choice">
        <strong>Övervakning</strong><span>Kontinuerlig övervakning av kommuner med live-data</span>
      </button>
      <button id="choose-scenarios" type="button" class="demo-choice">
        <strong>Scenarier</strong><span>Verkliga, historiska händelser som spelas upp</span>
      </button>
    </section>
    <section id="monitoring-view" hidden>
      <h2 class="menu-heading">Övervakning</h2>
      <div id="areas" class="demo-list"></div>
      <button type="button" class="menu-back">Tillbaka</button>
    </section>
    <section id="scenarios-view" hidden>
      <h2 class="menu-heading">Scenarier</h2>
      <div class="kiosk-choice">
        <button id="kiosk-toggle" type="button" class="kiosk-toggle" aria-pressed="false">KIOSKLÄGE AV</button>
        <p id="kiosk-help">Med kioskläge på spelar demon själv, visar slutbilden och börjar om, och det som stannar startas igen – utan operatör.</p>
      </div>
      <div id="demos" class="demo-list"></div>
      <button type="button" class="menu-back">Tillbaka</button>
    </section>
    <p id="menu-status" class="status" aria-live="polite">Välj övervakning eller scenarier.</p>
  </main>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const VIEWS = { start: "Välj övervakning eller scenarier.", monitoring: "Välj ett område. Skärmarna öppnas när övervakningen har startat.",
      scenarios: "Välj en demo. Skärmarna öppnas när demon har startat." };
    let kiosk = false;
    let starting = false;

    function show(view) {
      $("start-view").hidden = view !== "start";
      $("monitoring-view").hidden = view !== "monitoring";
      $("scenarios-view").hidden = view !== "scenarios";
      if (!starting) $("menu-status").textContent = VIEWS[view];
    }
    $("choose-monitoring").addEventListener("click", () => show("monitoring"));
    $("choose-scenarios").addEventListener("click", () => show("scenarios"));
    for (const back of document.querySelectorAll(".menu-back")) back.addEventListener("click", () => show("start"));

    function showKiosk() {
      $("kiosk-toggle").textContent = kiosk ? "KIOSKLÄGE PÅ" : "KIOSKLÄGE AV";
      $("kiosk-toggle").setAttribute("aria-pressed", String(kiosk));
    }
    $("kiosk-toggle").addEventListener("click", () => { kiosk = !kiosk; showKiosk(); });

    function lock(locked) {
      starting = locked;
      for (const button of document.querySelectorAll("button")) {
        button.disabled = locked || (button.classList.contains("scenario") && button.dataset.installed !== "true");
      }
    }

    async function choose(demo) {
      lock(true);  // the start page closes once a demo starts
      $("menu-status").textContent = `Startar ${demo.title}${kiosk ? " i kioskläge" : ""} … skärmarna öppnas när demon har startat.`;
      const response = await fetch("/api/demo/start", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ scenario: demo.name, kiosk }),
      }).catch(() => null);
      // Another screen may have chosen first: the start page is closing either way.
      if (response && response.status === 409) {
        // Its data were removed after the page opened: the others stay to choose from.
        $("menu-status").textContent = `${demo.title} saknar data – installera scenariots datapaket först.`;
        lock(false);
        for (const button of document.querySelectorAll("button.scenario")) {
          if (button.querySelector("strong").textContent === demo.title) button.disabled = true;
        }
        return;
      }
      if (!response || !response.ok) $("menu-status").textContent = "En demo startar redan – skärmarna öppnas när den har startat.";
    }

    async function monitor(area) {
      lock(true);
      $("menu-status").textContent = `Startar övervakningen av ${area.title} … skärmarna öppnas när den har startat.`;
      const response = await fetch("/api/demo/start", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ monitoring: area.name }),
      }).catch(() => null);
      if (!response || !response.ok) $("menu-status").textContent = "Något startar redan – skärmarna öppnas när det har startat.";
    }

    function choice(title, label, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `demo-choice ${className}`;
      const strong = document.createElement("strong");
      strong.textContent = title;
      const span = document.createElement("span");
      span.textContent = label;
      button.append(strong, span);
      button.addEventListener("click", onClick);
      return button;
    }

    fetch("/api/demos").then((response) => response.json()).then((menu) => {
      $("menu-title").textContent = menu.title;
      kiosk = Boolean(menu.kiosk);  // kept from the demo before (BYT SCENARIO) or --kiosk
      showKiosk();
      for (const area of menu.monitoring || []) $("areas").append(choice(area.title, area.label, "area", () => monitor(area)));
      for (const demo of menu.demos) {
        const button = choice(demo.title, demo.installed ? demo.label : "Data saknas – installera scenariots datapaket först",
          "scenario", () => choose(demo));
        button.dataset.installed = String(demo.installed);
        button.disabled = !demo.installed;
        $("demos").append(button);
      }
      // Back from a demo in kiosk mode or one named on the command line: straight to the scenarios.
      show(kiosk ? "scenarios" : "start");
    }).catch(() => { $("menu-status").textContent = "Startsidan svarar inte – starta med .venv/bin/python -m tools.start_demo."; });
  </script>
</body>
</html>
